<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminator Fleet - API Sniper</title>
    <style>
        /* --- CORE STYLING --- */
        body { background-color: #0a0a0c; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 20px; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00e676; }

        /* --- HEADER PANEL --- */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #151518; padding: 15px 25px; border-radius: 8px; border-bottom: 2px solid #00e676; box-shadow: 0 4px 15px rgba(0, 230, 118, 0.1); }
        .branding h1 { margin: 0; color: #00e676; font-size: 24px; letter-spacing: 1px; text-transform: uppercase; }
        .branding p { margin: 5px 0 0 0; font-size: 12px; color: #888; }
        
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .status-badge { background: #000; color: #00e676; padding: 8px 15px; border-radius: 4px; border: 1px dashed #00e676; font-family: monospace; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        /* 🚀 NEW: Note/Guideline Button */
        .btn-note { background: #2a1a00; color: #ff9800; border: 1px solid #ff9800; padding: 8px 15px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-weight: bold; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
        .btn-note:hover { background: #ff9800; color: #000; }

        /* --- MAIN LAYOUT --- */
        .main-workspace { display: flex; gap: 20px; flex-grow: 1; overflow: hidden; }
        
        .accounts-area { flex: 2; display: flex; flex-direction: column; background: #111; border-radius: 8px; border: 1px solid #222; padding: 15px; overflow: hidden; }
        .area-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .area-header h3 { margin: 0; color: #fff; }
        .btn-add { background: #333; color: #fff; border: 1px solid #555; padding: 8px 15px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .btn-add:hover { background: #444; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 15px; overflow-y: auto; padding-right: 5px; }

        .control-area { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .global-actions { background: #151518; padding: 20px; border-radius: 8px; border: 1px solid #222; display: flex; flex-direction: column; gap: 10px; }
        .btn-massive { padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-massive.start { background: #bb86fc; color: #000; box-shadow: 0 4px 10px rgba(187, 134, 252, 0.2); }
        .btn-massive.start:hover { background: #d0a8ff; }
        .btn-massive.stop { background: #cf6679; color: #fff; }
        .btn-massive.stop:hover { background: #ff4c4c; }

        .master-terminal { flex-grow: 1; background: #050505; border: 1px solid #333; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .term-header { background: #111; padding: 8px 15px; font-size: 12px; font-weight: bold; color: #888; border-bottom: 1px solid #333; }
        .term-body { flex-grow: 1; padding: 10px; font-family: 'Consolas', monospace; font-size: 12px; color: #00e676; overflow-y: auto; line-height: 1.5; }

        /* --- ACCOUNT CARDS --- */
        .account-card { background: #18181b; border: 1px solid #2a2a2a; border-radius: 8px; padding: 15px; position: relative; display: flex; flex-direction: column; gap: 10px; }
        .remove-btn { position: absolute; top: 12px; right: 12px; background: transparent; color: #888; border: none; cursor: pointer; font-size: 16px; }
        .remove-btn:hover { color: #cf6679; }
        
        .card-title { color: #00e676; font-weight: bold; font-size: 14px; margin-bottom: 2px; }
        
        .cmd-box { background: #000; border: 1px dashed #444; color: #888; font-family: monospace; font-size: 9px; padding: 6px; border-radius: 4px; cursor: pointer; margin-bottom: 5px; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cmd-box:hover { border-color: #bb86fc; color: #bb86fc; }

        .input-row { display: flex; gap: 10px; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 10px; color: #aaa; text-transform: uppercase; font-weight: bold; }
        .input-group input { padding: 6px; background: #0a0a0c; border: 1px solid #333; color: #fff; border-radius: 4px; font-size: 12px; font-family: monospace;}
        .input-group input:focus { border-color: #00e676; outline: none; }
        .input-group select { padding: 6px; background: #0a0a0c; border: 1px solid #333; color: #ff9800; border-radius: 4px; font-size: 11px; font-family: monospace; font-weight: bold; cursor: pointer; }
        .input-group select:focus { border-color: #00e676; outline: none; }

        .date-picker-tool { width: 36px; padding: 4px; border: 1px solid #333; background: #111; color: transparent; border-radius: 4px; cursor: pointer; position: relative; }
        .date-picker-tool::-webkit-calendar-picker-indicator { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; cursor: pointer; filter: invert(0.8) sepia(1) hue-rotate(80deg) saturate(3); opacity: 1; }
        .date-picker-tool:hover { border-color: #00e676; }

        .target-box { background: #111; padding: 10px; border-radius: 4px; border: 1px dashed #444; }
        
        .card-actions { display: flex; gap: 10px; margin-top: 5px; }
        .btn-card { flex: 1; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-card.start { background: #00e676; color: #000; }
        .btn-card.stop { background: #333; color: #fff; }

        .otp-container { display: none; background: #2a1a00; padding: 10px; border-radius: 4px; border: 1px dashed #ff9800; align-items: center; gap: 10px; margin-top: 5px;}
        .otp-container.active { display: flex; }
        .otp-container input { flex: 1; text-align: center; font-size: 16px; font-weight: bold; color: #ff9800; border-color: #ff9800; background: #111; }
        
        .mini-term { background: #000; border: 1px solid #222; border-radius: 4px; height: 60px; overflow-y: auto; padding: 5px 8px; font-family: monospace; font-size: 10px; color: #aaa; margin-top: 5px;}

        /* 🚀 NEW: Modal CSS for Instructions */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: #111; border: 2px solid #ff9800; border-radius: 10px; width: 85%; max-width: 900px; height: 85vh; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(255, 152, 0, 0.2); overflow: hidden; position: relative;}
        .modal-close-btn { position: absolute; top: 15px; right: 20px; background: #cf6679; border: none; color: white; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; z-index: 10; }
        .modal-close-btn:hover { background: #ff4c4c; }
        .modal-iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="branding">
            <h1>Zero-Delay Fleet Command</h1>
            <p>Continuous Auto-Scan API Sniping Architecture</p>
        </div>
        <div class="header-actions">
            <!-- 🚀 NEW: Guideline Button -->
            <button class="btn-note" onclick="document.getElementById('guidelineModal').style.display='flex'">
                📖 গাইডলাইন (A-Z)
            </button>
            <div class="status-badge">⚡ Continuous Strike Ready</div>
        </div>
    </div>

    <!-- 🚀 NEW: Guideline Modal Overlay -->
    <div class="modal-overlay" id="guidelineModal">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="document.getElementById('guidelineModal').style.display='none'">✖ CLOSE</button>
            <iframe class="modal-iframe" src="instructions.html"></iframe>
        </div>
    </div>

    <div class="main-workspace">
        
        <div class="accounts-area">
            <div class="area-header">
                <h3>Active Fleet Nodes</h3>
                <button class="btn-add" onclick="createAccountCard()">+ Add Node</button>
            </div>
            <div class="grid" id="accountsGrid"></div>
        </div>

        <div class="control-area">
            <div class="global-actions">
                <button class="btn-massive start" onclick="startAll()">🚀 LAUNCH ALL BOTS</button>
                <button class="btn-massive stop" onclick="stopAll()">🛑 ABORT FLEET</button>
            </div>
            
            <div class="master-terminal">
                <div class="term-header">SYSTEM EVENT LOGS</div>
                <div class="term-body" id="masterLog">
                    > Core continuous scanning system initialized...<br>
                    > Waiting for fleet configuration...<br>
                </div>
            </div>
        </div>
    </div>

    <script>
        let accountCounter = 0;
        const grid = document.getElementById('accountsGrid');
        const masterLog = document.getElementById('masterLog');

        function logToMaster(msg, color = '#00e676') {
            masterLog.innerHTML += `<span style="color:${color}">> ${msg}</span><br>`;
            masterLog.scrollTop = masterLog.scrollHeight;
        }

        // --- THE DATE FORMATTER (Magic Converter) ---
        function formatShohozDate(rawDate) {
            if (!rawDate) return "";
            const parts = rawDate.split('-'); 
            if (parts.length !== 3) return rawDate;
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const year = parts[0];
            const month = months[parseInt(parts[1], 10) - 1];
            const day = parts[2];
            return `${day}-${month}-${year}`;
        }

        // --- ACCOUNT CARD GENERATOR ---
        function createAccountCard() {
            accountCounter++;
            const port = 9221 + accountCounter;
            const cardId = `node-${port}`;
            const dojId = `doj-${port}`; 
            
            const chromeCmd = `"C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe" --remote-debugging-port=${port} --user-data-dir="C:\\chrome_profile_${accountCounter}"`;

            const card = document.createElement('div');
            card.className = 'account-card';
            card.id = cardId;
            card.innerHTML = `
                <button class="remove-btn" onclick="this.parentElement.remove()">✖</button>
                <div class="card-title">Node 0${accountCounter} • Port: ${port}</div>
                
                <div class="cmd-box" title="Click to copy command" onclick="navigator.clipboard.writeText(this.innerText); const orig=this.innerText; this.innerText='COPIED TO CLIPBOARD!'; this.style.color='#00e676'; setTimeout(()=>{this.innerText=orig; this.style.color='#888';}, 1000);">${chromeCmd}</div>
                
                <input type="hidden" class="inp-port" value="${port}">

                <div class="input-row">
                    <div class="input-group"><label>Origin</label><input type="text" class="inp-origin" value="Dhaka"></div>
                    <div class="input-group"><label>Destination</label><input type="text" class="inp-dest" value="Jamalpur_Town"></div>
                </div>

                <div class="input-row">
                    <div class="input-group" style="flex: 1.2;">
                        <label>Journey Date</label>
                        <div style="display: flex; gap: 5px;">
                            <input type="text" class="inp-doj" id="${dojId}" value="27-Jul-2026" placeholder="27-Jul-2026" style="flex: 1;">
                            <input type="date" class="date-picker-tool" title="Select Date" onclick="try{this.showPicker();}catch(e){}" oninput="if(this.value) document.getElementById('${dojId}').value = formatShohozDate(this.value);" onchange="if(this.value) document.getElementById('${dojId}').value = formatShohozDate(this.value);">
                        </div>
                    </div>
                    <div class="input-group" style="flex: 1.5;"><label>Train Name</label><input type="text" class="inp-train" value="TISTA EXPRESS (707)"></div>
                </div>

                <div class="target-box">
                    <div class="input-row" style="margin-bottom: 8px;">
                        <div class="input-group" style="flex: 1;"><label>Class</label><input type="text" class="inp-class" value="S_CHAIR"></div>
                        <div class="input-group" style="flex: 0.6;"><label>Qty</label><input type="number" class="inp-seats" value="2" min="1" max="4"></div>
                        <div class="input-group" style="flex: 2;"><label>Strategy (God Mode)</label>
                            <select class="inp-strategy">
                                <option value="0">0: Mid->End (Best for Single)</option>
                                <option value="1">1: Mid->Start (Best for Pair)</option>
                                <option value="2">2: End->Start (Hacker Zone)</option>
                                <option value="3">3: Start->End (Skip First 5)</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group"><label>Coaches (Optional)</label><input type="text" class="inp-coaches" placeholder="JHA, TA"></div>
                        <div class="input-group"><label>Exact Seats</label><input type="text" class="inp-targets" placeholder="JHA-41, JHA-42"></div>
                    </div>
                </div>

                <div class="card-actions">
                    <button class="btn-card start" onclick="startNode(${port})">▶ START</button>
                    <button class="btn-card stop" onclick="stopNode(${port})">⏹ STOP</button>
                </div>

                <!-- index.html এর কার্ড জেনারেটরের ভেতরের OTP বক্সের কোড -->
<div class="otp-container" id="otp-box-${port}" style="flex-direction: column; align-items: stretch; gap: 5px;">
    <div id="otp-phone-${port}" style="font-size: 11px; color: #00e676; text-align: center; font-weight: bold; letter-spacing: 1px;">
        📲 Waiting for OTP...
    </div>
    <div style="display: flex; gap: 10px; width: 100%;">
        <input type="text" id="otp-val-${port}" placeholder="ENTER OTP">
        <button class="btn-card start" style="flex: 0.5;" onclick="submitOtp(${port})">SUBMIT</button>
    </div>
</div>

                <div class="mini-term" id="term-${port}">Standing by...</div>
            `;
            grid.appendChild(card);
            logToMaster(`Node 0${accountCounter} initialized on Port ${port}.`, '#aaa');
        }

        // Initialize first 2 cards
        createAccountCard();
        createAccountCard();

        // --- IPC BRIDGE: SEND COMMANDS TO MAIN.JS ---
        function startNode(port) {
            const card = document.getElementById(`node-${port}`);
            
            const rawSeats = card.querySelector('.inp-targets').value;
            const targetSeatArray = rawSeats ? rawSeats.split(',').map(s => s.trim().toUpperCase()).filter(s => s) : [];
            
            const rawCoaches = card.querySelector('.inp-coaches').value;
            const targetCoachArray = rawCoaches ? rawCoaches.split(',').map(s => s.trim().toUpperCase()).filter(s => s) : [];

            const config = {
                port: port,
                origin: card.querySelector('.inp-origin').value.trim(),
                dest: card.querySelector('.inp-dest').value.trim(),
                doj: card.querySelector('.inp-doj').value.trim(),
                trainName: card.querySelector('.inp-train').value.trim(),
                seatClass: card.querySelector('.inp-class').value.trim(),
                seats: parseInt(card.querySelector('.inp-seats').value),
                strategy: parseInt(card.querySelector('.inp-strategy').value),
                targets: targetSeatArray,
                coaches: targetCoachArray
            };

            const term = document.getElementById(`term-${port}`);
            term.innerHTML = `> Initializing Continuous Sniper on Port ${port}...<br>`;
            
            window.electronAPI.startApiNode(config);
        }

        function stopNode(port) {
            window.electronAPI.stopApiNode(port);
            document.getElementById(`otp-box-${port}`).classList.remove('active');
        }

        function submitOtp(port) {
            const code = document.getElementById(`otp-val-${port}`).value;
            if(!code) return;
            document.getElementById(`otp-box-${port}`).classList.remove('active');
            
            window.electronAPI.submitOtp(port, code);
        }

        function startAll() {
            logToMaster("LAUNCHING FULL FLEET (CONTINUOUS MODE)...");
            const cards = document.querySelectorAll('.account-card');
            cards.forEach((card, index) => {
                const port = card.querySelector('.inp-port').value;
                setTimeout(() => startNode(port), index * 500); 
            });
        }

        function stopAll() {
            logToMaster("FLEET ABORTED MANUALLY.", "#cf6679");
            const cards = document.querySelectorAll('.account-card');
            cards.forEach(card => {
                const port = card.querySelector('.inp-port').value;
                stopNode(port);
            });
        }

        // --- IPC RECEIVERS: LISTEN TO MAIN.JS ---
        window.electronAPI.onApiLog((data) => {
            const term = document.getElementById(`term-${data.port}`);
            if(term) {
                term.innerHTML += `${data.message}<br>`;
                term.scrollTop = term.scrollHeight; 
            }
        });

        // index.html এর একদম নিচে এই লিসেনারটি আপডেট করুন:
window.electronAPI.onNeedOtp((data) => {
    const otpBox = document.getElementById(`otp-box-${data.port}`);
    const phoneLabel = document.getElementById(`otp-phone-${data.port}`);
    
    if(otpBox) {
        otpBox.classList.add('active');
        if(phoneLabel) {
            phoneLabel.innerText = `📲 OTP sent to: ${data.phone}`;
        }
    }
});
    </script>
</body>
</html>
