<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TicketBot Pro - Verification</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background-color: #1e1e1e; padding: 30px; border-radius: 8px; border: 1px solid #333; text-align: center; width: 350px; }
        input { width: 100%; padding: 10px; margin: 15px 0; background-color: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; text-align: center; font-size: 16px; font-weight: bold;}
        button { width: 100%; padding: 12px; background-color: #03dac6; color: #000; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .whatsapp-box { margin-top: 20px; padding: 15px; background-color: #112a23; border: 1px solid #25D366; border-radius: 6px; }
        .whatsapp-box p { margin: 0 0 10px 0; font-size: 13px; color: #ccc;}
        .whatsapp-box a { color: #25D366; font-weight: bold; text-decoration: none; font-size: 18px;}
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #03dac6; margin-top: 0;">System Verification</h2>
        <p style="font-size: 14px; color: #aaa;">Enter your software license key to access the control panel.</p>
        
        <input type="text" id="licenseKey" placeholder="XXXX-XXXX-XXXX-XXXX">
        <button id="verifyBtn">Verify License</button>

        <p id="statusMsg" style="color: red; font-size: 13px; display: none; margin-top: 15px;"></p>

        <div class="whatsapp-box">
            <p>Don't have a verified license?</p>
            <p>Contact Admin to purchase access:</p>
            <a href="https://wa.me/8801701593102" target="_blank">💬 WhatsApp: +880 170-1593102</a> <br>
            <a href="https://wa.me/8801400359567" target="_blank">💬 WhatsApp: +880 140-0359567</a>

        </div>
    </div>

    <script>
        const btn = document.getElementById('verifyBtn');
        const msg = document.getElementById('statusMsg');

        btn.addEventListener('click', async () => {
            const key = document.getElementById('licenseKey').value.trim();
            if(!key) return;

            btn.innerText = "Checking Database...";
            btn.disabled = true;
            msg.style.display = "none";

            window.electronAPI.verifyLicense(key);
        });

        window.electronAPI.onVerificationResult((data) => {
            if (data.success) {
                msg.style.color = "#00ff00";
                msg.style.display = "block";
                msg.innerText = "✅ License Verified! Loading system...";
            } else {
                msg.style.color = "red";
                msg.style.display = "block";
                msg.innerText = "❌ " + data.error;
                btn.innerText = "Verify License";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
